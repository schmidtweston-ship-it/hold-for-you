<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1410">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hold for You</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#1a1410; --bg2:#241c16; --card:#2e241c; --card2:#3a2e24;
  --chalk:#f4efe6; --mute:#c9c2b5; --soft:#a89884;
  --gold:#c9a24a; --candle:#f5c97a; --cord:#e8d5a3;
  --ok:#8fb89a; --ink:#1a1410;
  --safe-b:env(safe-area-inset-bottom,0px);
  --serif:Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;color:var(--chalk);
  background:
    radial-gradient(900px 480px at 18% -10%,rgba(245,201,122,.18),transparent 55%),
    radial-gradient(700px 420px at 90% 10%,rgba(201,162,74,.12),transparent 50%),
    linear-gradient(180deg,var(--bg2),var(--bg) 40%);
  font:400 17px/1.5 var(--serif);
  padding:0 0 calc(28px + var(--safe-b));
}
main{max-width:560px;margin:0 auto;padding:28px 20px 40px}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.brand .mark{
  width:48px;height:48px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,var(--candle),var(--gold) 55%,#8a6a2a);
  box-shadow:0 0 28px rgba(245,201,122,.35);
  flex:none;
}
.brand h1{
  margin:0;font:500 1.65rem/1.15 var(--serif);color:var(--cord);
  letter-spacing:.01em;
}
.brand .sub{margin:3px 0 0;font:500 .78rem/1.3 var(--sans);color:var(--soft)}
.lede{
  color:var(--mute);font:400 1rem/1.55 var(--serif);
  margin:18px 0 22px;border-left:2px solid var(--gold);padding-left:14px;
}
.card{
  background:linear-gradient(165deg,var(--card),#261e18 90%);
  border:1px solid rgba(201,162,74,.22);
  border-radius:20px;padding:18px 18px 16px;margin:14px 0;
  box-shadow:0 10px 40px rgba(0,0,0,.25);
}
.card h2{
  margin:0 0 6px;font:500 1.15rem var(--serif);color:var(--candle);
}
.card .hint{margin:0 0 12px;font:500 .8rem/1.4 var(--sans);color:var(--soft)}
label{
  display:block;font:600 .72rem/1.2 var(--sans);letter-spacing:.06em;
  text-transform:uppercase;color:var(--soft);margin:10px 0 6px;
}
input,textarea{
  width:100%;font:400 1.05rem/1.4 var(--serif);color:var(--ink);
  background:var(--chalk);border:0;border-radius:14px;
  padding:14px 16px;margin:0 0 8px;
}
textarea{min-height:88px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible{
  outline:3px solid var(--candle);outline-offset:3px;
}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
button{
  appearance:none;border:0;cursor:pointer;
  font:650 .95rem/1.2 var(--sans);border-radius:999px;
  padding:14px 20px;color:var(--ink);
  background:linear-gradient(145deg,var(--candle),var(--gold));
  box-shadow:0 2px 0 #8a6a2a;
}
button.ghost{
  background:transparent;color:var(--cord);
  border:1px solid rgba(201,162,74,.4);box-shadow:none;
}
button.soft{
  background:var(--card2);color:var(--chalk);box-shadow:none;
  border:1px solid rgba(244,239,230,.08);
}
button:active{transform:translateY(1px)}
.who{
  font:500 1.45rem/1.25 var(--serif);color:var(--chalk);margin:4px 0 2px;
}
.meta{font:500 .8rem var(--sans);color:var(--soft)}
.streak{
  display:inline-flex;align-items:center;gap:8px;margin-top:10px;
  padding:8px 14px;border-radius:999px;
  background:rgba(143,184,154,.15);color:var(--ok);
  font:650 .85rem var(--sans);
}
.streak .n{font-size:1.15rem;color:var(--candle)}
.ways{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.way{
  appearance:none;border:1px solid rgba(201,162,74,.35);
  background:rgba(201,162,74,.08);color:var(--cord);
  border-radius:999px;padding:10px 14px;font:600 .82rem var(--sans);
  cursor:pointer;
}
.way.on{
  background:linear-gradient(145deg,var(--candle),var(--gold));
  color:var(--ink);border-color:transparent;
}
.cal{
  display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px;
}
.cal .d{
  aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font:650 .72rem var(--sans);color:var(--soft);background:rgba(255,255,255,.03);
  border:1px solid transparent;
}
.cal .d.held{
  background:rgba(201,162,74,.25);color:var(--candle);
  border-color:rgba(201,162,74,.45);
}
.cal .d.today{box-shadow:0 0 0 2px var(--candle)}
.cal .lab{
  font:600 .65rem var(--sans);color:var(--soft);text-align:center;padding:2px 0;
  aspect-ratio:auto;background:transparent;border:0;
}
.log{list-style:none;margin:8px 0 0;padding:0}
.log li{
  padding:12px 0;border-bottom:1px solid rgba(201,162,74,.12);
  font:400 .95rem/1.45 var(--serif);
}
.log li:last-child{border-bottom:0}
.log .when{display:block;font:600 .72rem var(--sans);color:var(--gold);margin-bottom:4px;letter-spacing:.04em}
.log .ways-line{font:500 .8rem var(--sans);color:var(--mute);margin-top:4px}
.foot{
  margin:28px 0 8px;text-align:center;
  font:500 .78rem/1.45 var(--sans);color:var(--soft);
}
.toast{
  position:fixed;left:50%;bottom:calc(24px + var(--safe-b));
  transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--chalk);color:var(--ink);padding:12px 18px;border-radius:999px;
  font:650 .85rem var(--sans);pointer-events:none;
  transition:opacity .25s,transform .25s;z-index:20;
  box-shadow:0 8px 30px rgba(0,0,0,.35);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}
.empty{color:var(--mute);font-style:italic;margin:8px 0}
</style>
</head>
<body>
<main id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
